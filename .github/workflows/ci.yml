name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    # Format/import checks are Python-version independent -- run once.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Black
        run: black --check .
      - name: isort
        run: isort --check-only .

  test-full:
    # Complete suite (including the compile-bound `slow` tests) on the dev
    # Python version, with coverage. This is the comprehensive gate.
    runs-on: ubuntu-latest
    # Hard cap so a memory-bomb / hung-worker never burns the 6h workflow
    # ceiling again (an OOM-killed xdist worker makes the job hang otherwise).
    # 45 -> 50: the suite runs 27-34 min, and a JAX bump invalidates every entry in
    # the restored .jax_cache, so the first run after one is fully cold. A cancelled
    # job never SAVES the cache either, so too tight a cap self-perpetuates. Kept
    # modest on purpose: the JAX floor is 0.10.2 precisely because 0.11.0 is ~2.6x
    # slower on the CPU backend, and a cap large enough to absorb that would hide
    # the regression instead of surfacing it.
    timeout-minutes: 50
    env:
      JAX_ENABLE_X64: "1"
      # Persist JAX's compiled executables across runs so the heavy FMM
      # compiles become warm-cache hits (conftest enables the disk cache only
      # when this dir is set).
      JACCPOT_TEST_JAX_CACHE_DIR: ${{ github.workspace }}/.jax_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.jax_cache
          # Recompiles are keyed on source; bust the cache when jaccpot changes.
          key: jax-compile-py313-${{ hashFiles('jaccpot/**/*.py') }}
          restore-keys: |
            jax-compile-py313-
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Full suite with coverage
        # `-n 2`: the memory-limited 2-core runner OOMs with more float64-FMM
        # workers (overrides pyproject's `-n auto`). `-m "not experimental"`
        # matches the default addopts; all `slow` tests DO run here.
        #
        # `--ignore=tests/unit/runtime`: the Dehnen-MAC suite there is 94 cases that
        # each build a solver and run a full FMM solve (26-95 s apiece on CPU), and
        # folding them in took this job from 36 min to over the 50 min cap. It has
        # its own job below rather than a bigger cap here, because this cap is a
        # deliberate regression detector -- see the timeout-minutes note above -- and
        # widening it to fit new tests is exactly what would blind it.
        run: |
          pytest -n 2 -m "not experimental" \
            --ignore=tests/unit/runtime \
            --cov=jaccpot --cov-branch \
            --cov-report=xml --cov-report=term:skip-covered
      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-mac-runtime:
    # The Dehnen mass-dependent MAC suite (tests/unit/runtime), split out of
    # test-full. 94 cases, every one building a solver and running a full FMM
    # solve: 26-95 s each on CPU, which is 20+ minutes this job absorbs so that
    # test-full keeps both its ~36 min profile and the meaning of its cap.
    #
    # Splitting also halves the COLD-cache cost per job, which matters more than it
    # looks: the .jax_cache key is hashFiles('jaccpot/**/*.py'), so any runtime
    # change starts cold, and a cancelled job never saves the cache -- so one
    # over-budget run makes the next one cold too, indefinitely. Two smaller jobs
    # each finish and each save.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      JAX_ENABLE_X64: "1"
      JACCPOT_TEST_JAX_CACHE_DIR: ${{ github.workspace }}/.jax_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.jax_cache
          # Separate key from test-full's: the two jobs compile disjoint sets, so
          # sharing one key would have them overwrite each other's entries.
          key: jax-compile-macrt-py313-${{ hashFiles('jaccpot/**/*.py') }}
          restore-keys: |
            jax-compile-macrt-py313-
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Dehnen MAC runtime suite
        # Same `-n 2` memory ceiling as test-full, and `slow` runs here too: this
        # job exists precisely to run the compile-bound cases.
        run: |
          pytest tests/unit/runtime -n 2 -m "not experimental" \
            --cov=jaccpot --cov-branch \
            --cov-report=xml:coverage-mac-runtime.xml \
            --cov-report=term:skip-covered
      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-mac-runtime
          path: coverage-mac-runtime.xml

  test-smoke:
    # Fast (non-slow) suite on the other supported Python versions for
    # version-compatibility. The ~50 compile-bound `slow` tests run only in
    # test-full (on 3.13); keeping them out of the matrix is where most of the
    # CI wall-clock reduction comes from.
    runs-on: ubuntu-latest
    # 25 -> 30: this job was already finishing at 24.6 of its 25 min before any
    # JAX change, so it had no headroom at all. See test-full's cap note.
    #
    # This was the only compile-bound job still running a COLD JAX cache, which is
    # why it kept being the one with no headroom: measured 23m14s, then 28m24s once
    # the G.10 branch added 47 gradient tests, and a 30m07s cancellation in between
    # -- with pytest itself reporting "778 passed, 47 skipped" before the axe fell.
    # The cache below is the same mechanism test-full and test-mac-runtime already
    # use, and it targets what CLAUDE.md names as the binding cost: compilation.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      JAX_ENABLE_X64: "1"
      JACCPOT_TEST_JAX_CACHE_DIR: ${{ github.workspace }}/.jax_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.jax_cache
          # Keyed per Python version as well as per source hash: the matrix legs
          # compile with different interpreters, and the existing keys' note about
          # disjoint sets overwriting each other applies between them too.
          key: jax-compile-smoke-py${{ matrix.python-version }}-${{ hashFiles('jaccpot/**/*.py') }}
          # The prefix fallback is what makes a library change only PARTIALLY cold
          # instead of fully: without it, any edit under jaccpot/ would put this job
          # back to a 28-minute cold run, and a cancelled job never saves a cache --
          # so one over-budget run would keep the next one cold indefinitely.
          restore-keys: |
            jax-compile-smoke-py${{ matrix.python-version }}-
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Smoke tests (fast subset)
        # Override the default addopts marker to also drop `slow`.
        run: pytest -n 2 -m "not slow and not experimental"

  benchmark-guard:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"

      - name: Run benchmark guard
        run: |
          python -m bench.ci_benchmark_guard \
            --n 384 \
            --runs 2 \
            --warmup 1 \
            --preset fast \
            --basis solidfmm \
            --theta 0.6 \
            --leaf-size 16 \
            --max-order 4 \
            --dtype float32
