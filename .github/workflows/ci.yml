name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same PR supersedes the run in flight; pushes to main always
# finish, so every merge commit keeps a complete result (and saves its caches).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Format/import checks are Python-version independent -- run once.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Black
        run: black --check .
      - name: isort
        run: isort --check-only .

  test-full:
    # The whole default collection, once, on the dev Python version, with coverage
    # -- and with jaxtyping + beartype runtime checks on every `tests/unit` shard.
    #
    # WHICH TESTS EACH SHARD RUNS is defined in `.github/scripts/test_shards.py`,
    # not here. `test-partition` (below) collects every shard and fails if any two
    # overlap or if a collected test belongs to none -- the check these comments
    # used to do by hand, re-counted whenever a directory moved (the move of the 20
    # root-level test files once left `tests/distributed` in no shard, and nothing
    # went red). The single-file jobs further down use the same script.
    #
    # SHARDED BY MEMORY, NOT BY COUNT. The single job peaked at 16.07 GB RSS on a
    # 16 GB runner; an OOM-killed worker surfaces as "the runner has received a
    # shutdown signal" / exit 143 partway through, not as a failure or a timeout. A
    # worker's RSS grows across the tests it runs (JAX holds compiled executables
    # in-process), so fewer tests per job is what bounds the peak. Integration
    # needs a shard of its own, and the mutual files must NOT be grouped together
    # (that concentrated the hogs into one worker and OOM-killed at `-n 1` too).
    # The memory fix proper is the `jax.clear_caches()` registration in
    # `tests/conftest.py`; the sharding pays for its wall-clock cost.
    #
    # RUNTIME TYPE CHECKS RIDE ON THE SAME RUN (`typecheck: "1"` below). This used
    # to be a separate `test-runtime-typecheck` job that ran all of `tests/unit` a
    # second time, while `test-mac-runtime` ran `tests/unit/runtime` a third time
    # and `test-smoke` most of it a fourth -- every unit test ran ~3x per push
    # (~5.2 h of runner time), and the separate jobs kept hitting their caps
    # (`test-mac-runtime` was cancelled at 50 min on main, #367). The checks exist
    # because three regressions reached main in 2026-08 through a stand-in object
    # or a value outside its declared type, two of them tests that passed while
    # asserting nothing; that protection is kept, on every unit test, in one pass.
    # `_typecheck.py` reads the switch at import, so it has to be job environment.
    #
    # `tests/distributed` is NOT here: every file in it skips below two devices,
    # so it runs in `test-distributed-tier` / `test-distributed-criterion` on
    # forced host devices instead.
    name: test-full (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A regression detector as much as a cap: it must sit above the real spread
    # and below the ~2.6x CPU slowdown that kept the JAX floor at 0.10.2 through
    # 0.11.0. If a shard starts timing out, split it by path in test_shards.py --
    # never raise this to fit it.
    timeout-minutes: 60
    strategy:
      # Every shard always reports: they cover disjoint parts of the suite.
      fail-fast: false
      matrix:
        include:
          - shard: integration
            typecheck: "0"
          - shard: mutual-static-device
            typecheck: "0"
          - shard: unit
            typecheck: "1"
          # tests/unit/runtime in two halves: the Dehnen-MAC / force-scale
          # criterion family (every case a full FMM solve, 26-95 s on CPU) and the
          # rest of the directory.
          - shard: unit-runtime-mac
            typecheck: "1"
          - shard: unit-runtime
            typecheck: "1"
          - shard: characterization
            typecheck: "0"
    env:
      JAX_ENABLE_X64: "1"
      JACCPOT_RUNTIME_TYPECHECK: ${{ matrix.typecheck }}
      # Persist JAX's compiled executables across runs so the heavy FMM
      # compiles become warm-cache hits (conftest enables the disk cache only
      # when this dir is set).
      JACCPOT_TEST_JAX_CACHE_DIR: ${{ github.workspace }}/.jax_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.jax_cache
          # Keyed per shard: the shards compile disjoint sets and would otherwise
          # race to save the same key. Keyed on source, so any `.py` edit misses the
          # exact key and restores the prefix -- and a cancelled job never saves,
          # which is why a cap that is too tight keeps the next run cold too.
          key: jax-compile-py313-${{ matrix.shard }}-${{ hashFiles('jaccpot/**/*.py') }}
          restore-keys: |
            jax-compile-py313-${{ matrix.shard }}-
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Suite with coverage
        # `-n 2`: the memory-limited runner OOMs with more float64-FMM workers
        # (overrides pyproject's `-n auto`). All `slow` tests DO run here.
        #
        # `--dist loadgroup`: `-n 2` bounds the worker COUNT, not what the two
        # workers hold at once; the block-step tests in test_mutual_fmm.py peak at
        # 1.3-1.9 GB each (see the `xdist_group` note there), and `loadgroup` pins
        # same-group tests to one worker so they serialise with each other only.
        #
        # `--durations=60` keeps per-test times in the log: they are what the
        # shard split and `tests/slow_tests.txt` are tuned from.
        #
        # Branch coverage is set by `[tool.coverage.run]` in pyproject.toml
        # (`branch = true`); `--cov-branch` here could not override it either way.
        run: |
          mapfile -t selection < <(python .github/scripts/test_shards.py args "${{ matrix.shard }}")
          pytest -n 2 --dist loadgroup -m "not experimental" "${selection[@]}" \
            --durations=60 \
            --cov=jaccpot \
            --cov-report=xml --cov-report=term:skip-covered
      - name: Upload coverage XML artifact
        # Per-shard name: each shard covers only the code its part of the suite
        # reaches, so these are partial reports and must not overwrite each other.
        # There is no `fail_under` gate; combine them downstream if a total is
        # ever wanted.
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.shard }}
          path: coverage.xml

  test-py-floor:
    # The oldest supported interpreter (3.12; every JAX 0.11.x needs >= 3.12, and
    # 3.13 is test-full's). This is a version-compatibility check, not a second run
    # of the suite: it replaces `test-smoke`, which ran every non-slow test again
    # in three shards. Selection in test_shards.py (`EXTRA["py-floor"]`): the
    # goldens, the public API surface and the Odisseo coupling contract.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_ENABLE_X64: "1"
      JACCPOT_TEST_JAX_CACHE_DIR: ${{ github.workspace }}/.jax_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.jax_cache
          key: jax-compile-py312-floor-${{ hashFiles('jaccpot/**/*.py') }}
          restore-keys: |
            jax-compile-py312-floor-
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Goldens and API contract on Python 3.12
        run: |
          mapfile -t selection < <(python .github/scripts/test_shards.py args py-floor)
          pytest -n 2 -m "not experimental" "${selection[@]}" --durations=20

  test-partition:
    # Collects every shard in `.github/scripts/test_shards.py` and the default
    # collection, and fails if two shards overlap or a collected test is in none.
    # Collection only -- nothing is compiled or run -- so it is cheap, and it is
    # what keeps "each test runs exactly once per push" true as files move.
    #
    # Forced host devices and nornax are installed so that the distributed and
    # cross-repo modules collect their tests rather than skip at module level;
    # otherwise a missing shard for them would be invisible here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      XLA_FLAGS: --xla_force_host_platform_device_count=4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev tools + nornax
        # Same order as test-cross-repo-nornax: the `[dev]` install last, so its
        # JAX ceiling wins over the unconstrained git installs.
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install git+https://github.com/TobiBu/nornax.git
          pip install -e ".[dev]"
      - name: Shards partition the suite
        run: python .github/scripts/test_shards.py check

  test-distributed-mutual:
    # The ONLY job that runs the distributed mutual FMM, because it is the only
    # one with more than one device.
    #
    # `tests/integration/test_mutual_distributed.py` is guarded by
    # `skipif(device_count() < 2)`, and every other job leaves JAX on its single
    # default CPU device -- so before this job existed the suite was collected and
    # skipped on every single run, and a green CI said nothing at all about the
    # lane. That is not hypothetical: the cross-domain ownership rule was wrong for
    # a merged LET coarse tree (two devices numbering the same remote node
    # differently, so they disagreed about who owns a pair), and it was caught by
    # hand locally, not here. The force was 8.6e-3 wrong while global momentum
    # stayed at 3.4e-17 and the cross-pair count stayed exactly right, so nothing
    # cheaper than this suite would have noticed.
    #
    # `--xla_force_host_platform_device_count=4` fakes four CPU devices, which is
    # enough for the collectives to be real: the halo import and the reverse halo
    # both go through a ragged all-to-all, and the pair partition needs at least
    # two domains to have anything to partition. It is NOT a substitute for real
    # multi-GPU -- NCCL is not exercised here -- but it is what makes the
    # correctness criteria (force vs an exact direct sum, GLOBAL momentum, overflow
    # reduced across devices) run at all.
    #
    # Its own job rather than an env var on an existing one: the flag changes the
    # device topology for the whole process, so folding it into a shared tier would
    # silently re-target every other test in that tier.
    #
    # Small on purpose -- 16 particles per device, seconds of compute -- so it adds
    # no memory pressure to a workflow already sharded against a 16 GB ceiling.
    runs-on: ubuntu-latest
    # Measured 6:09 for the four tests serially on a fast workstation; hosted
    # runners are the slower side of that, and every test compiles its own
    # shard_map program. 35 leaves room for a 3-5x runner penalty without being
    # so wide it stops detecting a real hang.
    timeout-minutes: 35
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      XLA_FLAGS: --xla_force_host_platform_device_count=4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Distributed mutual FMM suite
        # `-n 0`: four host devices live in ONE process and each test builds its
        # own mesh, so serial keeps the device set unambiguous.
        #
        # `-rs` prints skip reasons, which the next step needs in the log: a
        # module-level skip means the installed yggdrax predates the LET reverse
        # halo, and that has to be readable rather than inferred.
        run: |
          set -o pipefail
          # Exit 5 is pytest's "no tests were collected", which is what a
          # module-level skip produces in a job that runs ONE file. Tolerated here
          # so the next step gets to say WHY: it fails on a vacuous run with an
          # actionable message, where a bare exit 5 says nothing at all. Every other
          # non-zero code still fails this step.
          rc=0
          mapfile -t selection < <(python .github/scripts/test_shards.py args distributed-mutual)
          pytest "${selection[@]}" -n 0 -rs -v \
            | tee pytest-distributed-mutual.txt || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 5 ]; then exit "$rc"; fi
      - name: Fail if the suite was skipped rather than run
        # A skipped suite PASSES, and a green-but-vacuous job is worse than a red
        # one -- it is the exact state this job was added to end. Reuses the log
        # from the step above rather than running the suite twice.
        #
        # Keyed on `-rs`'s SKIPPED lines, not on parsing a "N passed" summary:
        # `addopts` already carries `-q`, so the summary line's presence depends on
        # how the two verbosity flags happen to cancel, and a guard that silently
        # stops matching is the failure mode being guarded against. Whether the
        # tests PASSED is the previous step's exit code, not this step's business.
        #
        # It matches VACUITY, not any SKIPPED line, and the distinction is load
        # bearing. Every skip in this file used to be a whole-module one -- an old
        # yggdrax, or fewer than two devices -- so "any skip" and "nothing ran" were
        # the same thing and `^SKIPPED` was exact. They are not the same any more:
        # the file now carries per-test skips that are correct on this runner (a
        # kernel needing sm_80, a level-weighted path needing a newer yggdrax while
        # the unweighted lane runs fine), and reading one of those as vacuity would
        # fail the job over a test that could not have run anywhere on a CPU box.
        #
        # So: nothing collected, or one of the two whole-module guards firing. Both
        # module-level reasons say "the distributed mutual force needs", which is
        # what anchors the second pattern.
        run: |
          if grep -qE "no tests ran|collected 0 items" pytest-distributed-mutual.txt \
             || grep -qE "^SKIPPED.*the distributed mutual force needs" pytest-distributed-mutual.txt; then
            echo "::error::the distributed mutual suite was skipped, not run -- see the reason in the previous step"
            exit 1
          fi

  # The cross-repo conformance tier, in TWO jobs because they cost two different
  # things -- and because the cheap half is the one worth failing fast on.
  #
  # jaccpot's `BlockStepFMM` satisfies nornax's `MutualForceModel` /
  # `FusedMutualForceModel` STRUCTURALLY: `jaccpot/nornax_adapter.py` deliberately does
  # not import nornax, so the dependency graph stays acyclic (Jaccpot -> Yggdrax, Nornax
  # standalone, ODISSEO -> both). These two files are the only thing that checks the
  # duck-typing still holds -- the protocol match itself, both block-step schedules
  # agreeing, and jaccpot's own base step matching nornax's.
  #
  # WHY THEY EXIST. Until they did, all 24 of those tests skipped on EVERY run and the
  # suite stayed green. nornax was installed by no job, and `tests/conftest.py`'s
  # `_find_sibling_checkout` resolves nornax from a SIBLING CHECKOUT -- which exists in a
  # local layout and never in a single-repo `actions/checkout`. So the tests passed
  # locally, skipped in CI, and nothing would have caught a protocol drift.
  test-cross-repo-nornax:
    name: test-cross-repo-nornax
    runs-on: ubuntu-latest
    # Measured on ubuntu-latest: the adapter suite step took 13 min up to jaccpot#312
    # and 22 min once #316 added the multi-step FMM gradient tests (five FMM rollouts
    # differentiated, plus their finite differences). At 25 the job was cancelled
    # mid-suite on the next PR with ~2 min of install in front of it. 45 restores
    # the 2x headroom the original 25 had over 13. If the suite grows again, split
    # the gradient tests into their own step rather than raising this further.
    timeout-minutes: 45
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      # NB: XLA_FLAGS is deliberately NOT set. Forcing four host devices makes this file
      # ~5x slower (measured: ~11 s/test without, ~36 s/test with, same 12 tests, same
      # box) and it needs exactly one device. The distributed half is the job below.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev tools + nornax
        # ORDER IS LOAD-BEARING, for the reason pyproject.toml already records for
        # yggdrax: a bare `pip install git+...` resolves JAX unconstrained, and the
        # `<0.12` ceiling in `pip install -e ".[dev]"` is what brings it back into range.
        # nornax's own floor is jax>=0.8.0, so the resulting 0.11.x satisfies it.
        #
        # nornax is TRACKED UNPINNED on purpose. A pinned SHA gives a reproducible build
        # that by construction can never tell you the protocol drifted, which is the one
        # thing these jobs are for. The cost is that a nornax push can redden jaccpot's
        # CI. If that becomes disruptive, pin here and add a scheduled unpinned run.
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install git+https://github.com/TobiBu/nornax.git
          pip install -e ".[dev]"
      - name: Adapter conformance suite
        # `-rs` puts skip reasons in the log, which the guard step reads.
        run: |
          set -o pipefail
          rc=0
          mapfile -t selection < <(python .github/scripts/test_shards.py args nornax-adapter)
          pytest "${selection[@]}" -n 0 -rs -v \
            | tee pytest-cross-repo-adapter.txt || rc=$?
          # Exit 5 is pytest's "no tests were collected", which is what a module-level
          # skip produces in a job that runs ONE file. Tolerated so the guard below gets
          # to say WHY, with an actionable message, rather than dying on a bare exit 5.
          # Every other non-zero code still fails this step.
          if [ "$rc" != 0 ] && [ "$rc" != 5 ]; then exit "$rc"; fi
      - name: Fail if the suite was skipped rather than run
        # A skipped suite PASSES, and a green-but-vacuous job is the exact state this job
        # was added to end. Anchored on the module-level skip message --
        # `pytest.skip(f"nornax unavailable: {exc!r}", allow_module_level=True)` -- and
        # NOT on any SKIPPED line, so a legitimate per-test skip cannot fail the job.
        run: |
          if grep -qE "no tests ran|collected 0 items" pytest-cross-repo-adapter.txt \
             || grep -qE "^SKIPPED.*nornax unavailable" pytest-cross-repo-adapter.txt; then
            echo "::error::the cross-repo nornax adapter suite was skipped, not run -- see the reason in the previous step"
            exit 1
          fi

  # The distributed half, split out for the same reason `test-distributed-criterion` is:
  # what it costs. Its 12 tests each build their own mesh on forced host devices.
  #
  # MEASURED: the two files together, all 24 tests, took 32:48 on a fast workstation with
  # four forced devices throughout. Subtracting the adapter file at that device count
  # (~36 s/test x 12) leaves ~26 min for this half alone. Hosted runners are the slower
  # side of that, which is why the timeout is 90 rather than the 35 a naive reading of the
  # local number would suggest -- and why this is not folded into the job above, where it
  # would hold a 2-minute protocol check hostage to a 26-minute mesh suite.
  test-cross-repo-nornax-distributed:
    name: test-cross-repo-nornax-distributed
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      # Below two devices these tests skip per-test rather than run.
      XLA_FLAGS: --xla_force_host_platform_device_count=4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev tools + nornax
        # Same ordering constraint as the job above.
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install git+https://github.com/TobiBu/nornax.git
          pip install -e ".[dev]"
      - name: Distributed conformance suite
        # `-n 0`: the four forced host devices live in ONE process and each test builds
        # its own mesh, so serial keeps the device set unambiguous.
        run: |
          set -o pipefail
          rc=0
          mapfile -t selection < <(python .github/scripts/test_shards.py args nornax-distributed)
          pytest "${selection[@]}" -n 0 -rs -v \
            | tee pytest-cross-repo-distributed.txt || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 5 ]; then exit "$rc"; fi
      - name: Fail if the suite was skipped rather than run
        # Vacuity only -- see the note in the job above. This file legitimately skips
        # per-test when a kernel needs sm_80, and reading that as vacuity would fail the
        # job over a test that could not have run on a CPU box.
        run: |
          if grep -qE "no tests ran|collected 0 items" pytest-cross-repo-distributed.txt \
             || grep -qE "^SKIPPED.*nornax unavailable" pytest-cross-repo-distributed.txt; then
            echo "::error::the cross-repo nornax distributed suite was skipped, not run -- see the reason in the previous step"
            exit 1
          fi

  # The Dehnen-criterion tier, in its own job because of what it costs.
  #
  # One distributed FMM evaluation is ~190 s of COMPILATION on a forced-CPU mesh, and
  # that is flat in N, leaf size and expansion order -- all three measured -- so it is a
  # per-CONFIGURATION cost that a smaller problem cannot reduce. The criterion needs four
  # distinct configurations (geometric baseline, criterion with the cross walk, criterion
  # self-only, and a second eps), plus a differentiable twin for the topology-seam test.
  # Folded into `test-distributed-tier` that is ~11 min on top of its existing ~24, and
  # the 2-core hosted runner was killed outright (SIGTERM after four tests, with 54 of
  # its 60 minutes unused -- so memory, not time).
  #
  # Split rather than deselected: `slow` was the obvious marker to reuse and is the wrong
  # one, because the standard tier deliberately RUNS three slow-marked distributed tests
  # and excluding slow there would have silently dropped them.
  test-distributed-criterion:
    name: test-distributed-criterion
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      XLA_FLAGS: --xla_force_host_platform_device_count=2
      JACCPOT_TEST_JAX_CACHE_DIR: ${{ github.workspace }}/.jax_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jax-cache-criterion-${{ runner.os }}-${{ hashFiles('jaccpot/**/*.py') }}
          restore-keys: |
            jax-cache-criterion-${{ runner.os }}-
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Dehnen-criterion tier on forced devices
        run: |
          set -o pipefail
          rc=0
          mapfile -t selection < <(python .github/scripts/test_shards.py args distributed-criterion)
          pytest "${selection[@]}" -n 1 -rs \
            | tee pytest-criterion-tier.txt || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 5 ]; then exit "$rc"; fi
      - name: Fail if the tier was skipped rather than run
        # Same failure this guard ends elsewhere: `device_count() < 2` makes a skipped
        # tier PASS, and a green-but-vacuous job is worse than a red one. The
        # cross-domain tests carry ONE legitimate skip -- they need yggdrax's cross-walk
        # `pair_policy` (PR #54) and probe for it -- so the check is that the marked set
        # ran at all, not that nothing skipped.
        run: |
          if grep -qE "no tests ran|collected 0 items" pytest-criterion-tier.txt \
             || grep -qE "^SKIPPED.*needs >= 2 devices" pytest-criterion-tier.txt; then
            echo "::error::the criterion tier did not run on forced devices"
            exit 1
          fi

  test-distributed-tier:
    # `tests/distributed/` on forced CPU devices -- the tier itself, which until
    # now ran nowhere.
    #
    # `test-distributed-mutual` above does this for ONE file
    # (`tests/integration/test_mutual_distributed.py`). The tier proper was never
    # in CI at all, and it is guarded on `device_count() < 2`, so every run
    # collected it and skipped it. Measured on this repo:
    #
    #     no forced devices    4 passed, 28 skipped
    #     2 forced devices    31 passed,  1 skipped
    #
    # `bench/distributed_gate.py` -- the two-card gate -- names this gap in its own
    # docstring and calls it "the cheap 90% [that] needs no hardware at all". This
    # job is that 90%. The remaining 10% is what CPU structurally cannot reach (the
    # native ragged halo exchange, the fused Pallas near field, real NCCL), and
    # that stays with the two-card gate; audit F34.
    #
    # TWO devices, not the sibling's four. Two is where every file in the tier
    # un-skips, it is what the two-card gate targets, and it is what the numbers
    # above were measured at. Four would cost more memory for nothing.
    #
    # Its own job for the reason the sibling documents: the flag changes device
    # topology for the whole process, so folding it into a shared tier would
    # silently re-target every other test there.
    name: test-distributed-tier
    runs-on: ubuntu-latest
    # Measured 12:55 at `-n 2` on a fast workstation (31 passed, 1 skipped);
    # 20:18 at `-n 0`, so xdist buys 36% and each worker gets its own forced
    # devices with identical results. 60 leaves the ~4x runner penalty the
    # sibling job budgets for, without being so wide it stops detecting a hang.
    timeout-minutes: 60
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      XLA_FLAGS: --xla_force_host_platform_device_count=2
      JACCPOT_TEST_JAX_CACHE_DIR: ${{ github.workspace }}/.jax_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          # Own key: every test here compiles its own `shard_map` program, which
          # no other job compiles, and three jobs racing one key means two lose.
          path: ${{ github.workspace }}/.jax_cache
          key: jax-compile-py313-disttier-${{ hashFiles('jaccpot/**/*.py') }}
          restore-keys: |
            jax-compile-py313-disttier-
      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"
      - name: Distributed tier on forced devices
        run: |
          set -o pipefail
          rc=0
          mapfile -t selection < <(python .github/scripts/test_shards.py args distributed-tier)
          pytest "${selection[@]}" -n 2 -rs \
            | tee pytest-distributed-tier.txt || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 5 ]; then exit "$rc"; fi
      - name: Fail if the tier was skipped rather than run
        # The failure this job exists to end: `device_count() < 2` makes a skipped
        # tier PASS, and a green-but-vacuous job is worse than a red one.
        #
        # Anchored on the module guards' own wording, `needs >= 2 devices`, which
        # all four of them share -- NOT on any SKIPPED line. That distinction is
        # load bearing here for the same reason the sibling records it: the tier
        # carries one legitimate per-test skip on a CPU runner
        # (`test_native_halo_exchange_is_fixed_upstream`, opt-in behind
        # JACCPOT_CHECK_UPSTREAM_RAGGED_FIX and reachable only on real cards), and
        # reading that as vacuity would fail the job over a test that could not
        # have run here at all.
        #
        # Both patterns were validated against real logs before this landed: the
        # unforced run (24 SKIPPED lines) fires it, the forced run does not, and
        # the opt-in skip alone does not.
        run: |
          if grep -qE "no tests ran|collected 0 items" pytest-distributed-tier.txt \
             || grep -qE "^SKIPPED.*needs >= 2 devices" pytest-distributed-tier.txt; then
            echo "::error::the distributed tier was skipped, not run -- the forced-device flag did not take effect"
            exit 1
          fi

  benchmark-guard:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/TobiBu/yggdrax.git
          pip install -e ".[dev]"

      - name: Run benchmark guard
        run: |
          python -m bench.ci_benchmark_guard \
            --n 384 \
            --runs 2 \
            --warmup 1 \
            --preset fast \
            --basis solidfmm \
            --theta 0.6 \
            --leaf-size 16 \
            --max-order 4 \
            --dtype float32
