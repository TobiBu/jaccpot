repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.0b5
    hooks:
      - id: isort

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.9.1
    hooks:
      - id: pydoclint
        # Runs on commit. Docstring drift is cheap to catch now and expensive to fix
        # in bulk later. Config lives in pyproject.toml so that
        # `pydoclint --config pyproject.toml jaccpot/` reproduces the hook exactly.
        #
        # `skip-checking-short-docstrings = false` there is what makes this hook
        # mean anything. There is no baseline any more: the Tier 2.5 programme drove
        # `jaccpot/` to 0 and the baseline was retired, because one that suppresses
        # nothing real can still absorb a NEW violation in a file it still lists.
        #
        # SCOPED, and the scope is what makes retiring the baseline safe. The
        # baseline's final 1215 entries were entirely outside `jaccpot/` (tests/
        # 1034, bench/ 121, examples/ 60), so an unscoped hook with no baseline
        # would be red on day one over violations it had never been catching.
        # `^jaccpot/` keeps enforcement on the package exactly as it was, minus the
        # suppression mechanism. Widening this to tests/, bench/ or examples/ means
        # documenting those 1215 first -- it is a real backlog, not a flag flip.
        files: ^jaccpot/
        args: ["--config", "pyproject.toml"]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # UNDEFINED NAMES ONLY -- deliberately not a style linter.
        #
        # black, isort and pydoclint cannot see a name that is used but never
        # imported, and neither can the test suite: every runtime module has
        # `from __future__ import annotations`, so an unimported name inside an
        # annotation is stored as a lazy string and never evaluated. Three real
        # defects shipped through the full green gate that way -- audit G.1a
        # (`_accumulate_from_multipoles`), G.1b
        # (`evaluate_local_complex_with_grad_analytic`), and PR #94's
        # `MACTypeInput`.
        #
        # `--select` is the whole point: F821 undefined name and F822 undefined
        # name in `__all__`. Line length, import order and formatting stay with
        # black and isort, so this hook adds no style opinions and cannot start
        # arguing with them.
        #
        # F811 (redefinition) was tried and dropped. It fires on the legitimate
        # "None, then conditionally def the same name" idiom at
        # `fmm_sweeps.py:380`, so keeping it would mean annotating correct code to
        # satisfy the linter. The three defects this hook exists for were all
        # undefined names.
        #
        # `--builtins` is the jaxtyping axis vocabulary, and it is here because
        # pyflakes parses a string inside an annotation as a forward reference.
        # `Float[Array, "n 3"]` is fine -- "n 3" is not a Python identifier, so it
        # is ignored -- but `Float[Array, "n"]` reports `F821 undefined name 'n'`.
        # Only SINGLE-identifier axes trip it, which is exactly the 1-D case where
        # a shape annotation is cheapest and most useful (`masses: Float[Array,
        # "n"]`). Measured 2026-08-18.
        #
        # The alternative was a `# noqa: F821` per annotation, rejected because the
        # count grows with every annotation added and the suppression would end up
        # on hundreds of lines. This list is the axis vocabulary itself, so it also
        # documents it:
        #
        #     n         particles
        #     t         targets, when a call returns a subset of the particles
        #     ct        Cartesian packed coefficients, (p+1)(p+2)(p+3)/6. NOT `C`,
        #               which is the spherical-harmonic packing (p+1)**2; the two
        #               agree only at p=1, which is how one symbol served both
        #     levels    block-step levels, `k_max + 1` of them
        #     internal  internal tree nodes (those with children)
        #     leaves    leaf nodes
        #     edges     entries of the flattened neighbour list
        #     pairs     entries of a precomputed leaf-pair schedule
        #     blocks    target blocks; extent never observed non-zero
        #     blocksize the target block size, `JACCPOT_LARGE_N_TARGET_BLOCK_SIZE`
        #     farleaves the FAR-field leaf view, which is not the near-field one:
        #               they differ on the octree backend (5 vs 3)
        #     _         an anonymous axis: rank asserted, extent deliberately not.
        #               Needed as a builtin only for the SINGLE-axis spelling
        #               `Int[Array, "_"]`; `"_ 2"` and `"leaves _ _"` are
        #               multi-token and pyflakes already ignores them. The cost is
        #               narrow but real: a bare `_` used and never assigned stops
        #               being flagged.
        #
        # THE COST, stated because it is real: a bare `n` used in code and never
        # assigned is no longer flagged. Verified that everything this hook exists
        # for still is -- `MACTypeInput` (PR #94's defect) still reports F821, and
        # F822 on `__all__` is untouched. Grow this list only alongside the
        # annotations that need it, one reviewed entry at a time; it is not a
        # general-purpose ignore.
        args:
          [
            "--select=F821,F822",
            "--builtins=n,t,ct,levels,internal,leaves,edges,pairs,farleaves,blocks,blocksize,_",
          ]
        # NOT scoped: the whole repo, `examples/` and `bench/` and `tests/` included.
        # It was `files: ^jaccpot/` when introduced, because
        # `examples/benchmark_gpu_radix_worker.py` carried 14 pre-existing F821s and
        # cleaning them was its own PR. That PR happened; the count across every
        # tracked file is now zero, so the restriction is gone.
        #
        # `bench/` and `examples/` are exempt from CLAUDE.md's test-first rule, which
        # is about *tests*, not about whether a name resolves -- an undefined name in a
        # benchmark is still a crash waiting for the branch that reaches it.

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: env
        language: system
        pass_filenames: false
        args: ["JAX_ENABLE_X64=1", "pytest", "-q"]
        stages: [manual]
