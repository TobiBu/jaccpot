[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaccpot"
version = "0.0.1"
description = "JAX Fast Multipole Method solver package built on yggdrax tree artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "AstroAI Lab", email = "astroai@iwr.uni-heidelberg.de" },
  { name = "Tobias Buck", email = "tobias.buck@iwr.uni-heidelberg.de" },
]
maintainers = [{ name = "AstroAI Lab", email = "astroai@iwr.uni-heidelberg.de" }]
keywords = ["fmm", "n-body", "jax", "gravity", "treecode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  # Cap below 0.9.1: the `backend=` kwarg of
  # `jax.experimental.pallas.pallas_call` was removed in a 0.9.x patch, and the
  # fused M2L Pallas kernels (jaccpot/pallas/*) still pass it. The package is
  # developed/tested against 0.9.0. The unpinned `>=0.8.0` let CI resolve
  # 0.10.2/0.9.2 and broke the Pallas tests. Lift this ceiling once the Pallas
  # call sites are ported to the newer pallas_call API.
  #
  # Measured boundary (2026-07-30), because it is documented in no changelog:
  # `backend=` is present in 0.9.0.1 and GONE in 0.9.1 -- `pallas_call() got an
  # unexpected keyword argument 'backend'` from jaccpot/pallas/m2l_real_fused.py
  # on 0.9.1. In 0.9.1 the backend is implied by the `compiler_params` dataclass
  # (`pl.triton.CompilerParams` vs `pl.mosaic_gpu.CompilerParams`).
  #
  # UNFORTUNATE COLLISION: 0.9.1 is also the first release that FIXES the
  # `jax.lax.ragged_all_to_all` reverse-pass bug which silently corrupts the
  # multi-GPU forward after a gradient (verified: reproducer 6/6 CORRUPT on
  # 0.9.0.1, 4/4 CLEAN on 0.9.1; see docs/differentiable_fmm_distributed_audit.md).
  # So this ceiling is exactly what keeps the differentiable distributed path on
  # the slower `all_gather` halo exchange. Porting the Pallas call sites is
  # therefore worth more than it looks: it unblocks a bandwidth win on the grad
  # path as well as the JAX upgrade. `halo_exchange="auto"` already switches to
  # the ragged exchange by itself once the installed JAX is >= 0.9.1, so no
  # further change is needed on the gradient side after the ceiling lifts.
  "jax[cuda]>=0.8.0,<0.9.1",
  "jaxlib>=0.4.0,<0.9.1",
  "jaxtyping>=0.2.23",
  "beartype>=0.14.0",
  "yggdrax>=0.0.1,<0.1.0",
]

[project.urls]
Homepage = "https://github.com/AstroAI-Lab/jaccpot"
Repository = "https://github.com/AstroAI-Lab/jaccpot"
Issues = "https://github.com/AstroAI-Lab/jaccpot/issues"
Documentation = "https://github.com/AstroAI-Lab/jaccpot#readme"

[project.optional-dependencies]
dev = [
  # Pinned to match .pre-commit-config.yaml's black-pre-commit-mirror rev so a
  # local `black` and the hook/CI format identically (a floating ">=" let CI
  # resolve to a different black whose style disagreed with the hook).
  "black==26.5.1",
  # Pinned to match .pre-commit-config.yaml. isort 7.0.0/8.0.1 regressed the
  # black profile (force-wraps single-name imports); 9.0.0b1 fixes it. A
  # floating ">=" here lets CI's `isort --check-only .` resolve to the broken
  # 8.0.1 and disagree with pre-commit, so keep this equal to the hook rev.
  "isort==9.0.0b1",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6.0",
  "pre-commit>=3.8.0",
  "build>=1.2.2",
  "twine>=5.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jaccpot*"]

[tool.setuptools.package-data]
jaccpot = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
include = "\\.pyi?$"
exclude = '''
/(
  \.git
 |\.venv
 |build
 |dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
markers = [
    "slow: long-running / compile-heavy test (deselect with -m 'not slow')",
    "experimental: exercises experimental, non-production FMM code (octree/treecode prototypes); deselected by default, run explicitly with -m experimental",
]
# `-n auto` runs the (compilation-bound) JAX test suite across all logical cores
# via pytest-xdist. On a 72-core host this cuts wall-clock from ~25 min to ~2 min;
# a fixed `-n 32` measured marginally faster there. Override with `-n 0` to run
# serially (e.g. for pdb/`-x` debugging, which xdist does not support).
# `-m "not experimental"` keeps the everyday run on the production (radix real
# fast-lane) paths; the long-compile octree/treecode prototypes are opt-in via
# `pytest -m experimental`.
addopts = "-q --strict-markers --ignore=tests/perf -n auto -m \"not experimental\""

[tool.coverage.run]
source = ["jaccpot"]
branch = true
omit = [
  # Opt-in experimental prototypes (octree/treecode): deselected by the
  # `experimental` marker in the default suite, so they are exercised only by
  # `pytest -m experimental`, not by the coverage-gated CPU run. Covering them
  # here would just dilute the metric with code the default suite does not run.
  "jaccpot/experimental/*",
  # GPU-only fused real-basis Pallas kernel (Ampere+). Unlike the other Pallas
  # kernels (which the CPU CI exercises via interpret=True), this one has no
  # interpret path, so CPU CI structurally cannot reach it; it is validated by
  # the manual A100 Pallas parity runs.
  "jaccpot/pallas/m2l_real_fused.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
